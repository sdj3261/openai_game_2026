name: Deploy 8 Second Crew

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out 8 Second Crew
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Test game
        run: npm test
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html design-system.css styles.css game.js input-utils.js profile-utils.js i18n.js _site/
          cp -R assets _site/
          cp .nojekyll _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
