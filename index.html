<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#72d9ff" />
    <meta name="description" content="8초 행동을 복제한 아까미와 함께 장난감 도시의 보석을 훔치는 잠입 게임" />
    <title>8초 도둑단 — 나를 복제해 보석을 훔쳐요</title>
    <link rel="stylesheet" href="./design-system.css?v=0.6.3" />
    <link rel="stylesheet" href="./styles.css?v=0.6.3" />
  </head>
  <body>
    <a class="skip-link" href="#game">게임 화면으로 바로가기</a>
    <main class="game-shell" id="mainContent">
      <section class="topbar ds-surface" aria-label="작전 상태">
        <div class="brand"><span class="brand-mark" aria-hidden="true">⏱</span> <span id="brandText">8초 도둑단</span></div>
        <div class="mission-copy">
          <span id="stageName">WORLD 01</span>
          <small id="objective">빨간 레이더를 피해 보석 GET!</small>
        </div>
        <div class="hud-cluster" aria-label="현재 타임라인 정보">
          <div class="hud-stat"><span id="loopLabel">루프</span><strong id="loopCount">1</strong></div>
          <div class="hud-stat"><span id="echoLabel">아까미</span><strong id="echoCount">0</strong></div>
          <div class="hud-stat timer-stat"><span id="timeLabel">남은 시간</span><strong id="timer">8.0</strong></div>
        </div>
      </section>

      <section class="canvas-wrap">
        <canvas id="game" width="1200" height="700" tabindex="0" aria-label="8초 도둑단 장난감 도시 잠입 게임 화면" aria-describedby="gameHelp gameState">
          Canvas를 지원하는 최신 브라우저에서 플레이할 수 있습니다.
        </canvas>
        <p class="sr-only" id="gameHelp">방향키 또는 WASD와 화면 터치로 이동합니다. Z는 소음 미끼, X는 현재 8초 행동을 아까미로 복제합니다. 빨간 경비 레이더를 피해 보석을 챙기고 출구에 도착하면 완료됩니다.</p>
        <p class="sr-only" id="gameState">작전 메뉴가 열렸습니다.</p>

        <div class="alert-meter" id="alertMeter" role="meter" aria-label="발각 위험도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="안전">
          <span id="alertLabel">발각</span>
          <div class="alert-track"><i id="alertFill"></i></div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="sound-caption" id="soundCaption" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="overlay visible" id="overlay" role="dialog" aria-modal="true" aria-hidden="false" aria-labelledby="overlayTitle"></div>
      </section>

      <section class="mobile-gamepad ds-surface" aria-label="모바일 게임 조작">
        <div class="virtual-stick" id="virtualStick" role="application" tabindex="0" aria-label="이동 조이스틱. 손가락으로 끌어 이동합니다." aria-valuetext="중앙 · 정지">
          <span class="virtual-stick__tick virtual-stick__tick--up" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--right" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--down" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--left" aria-hidden="true"></span>
          <span class="virtual-stick__knob" id="virtualStickKnob" aria-hidden="true"><i></i></span>
          <span class="virtual-stick__label" aria-hidden="true">MOVE</span>
        </div>

        <div class="mobile-primary-actions">
          <button class="mobile-action mobile-action--noise" type="button" data-game-action="noise" aria-keyshortcuts="Z"><strong>Z</strong><span id="noiseActionLabel">소음</span></button>
          <button class="mobile-action mobile-action--echo" type="button" data-game-action="save" aria-keyshortcuts="X"><strong>X</strong><span id="cloneActionLabel">복제</span></button>
        </div>

        <nav class="mobile-utility-actions" aria-label="추가 게임 조작">
          <button class="utility-action" type="button" data-game-action="restart" aria-label="현재 루프 재시작" aria-keyshortcuts="R"><span aria-hidden="true">↺</span><small id="restartActionLabel">다시</small></button>
          <button class="utility-action" type="button" data-game-action="undo" aria-label="마지막 에코 취소"><span aria-hidden="true">−1</span><small id="undoActionLabel">취소</small></button>
          <button class="utility-action" type="button" data-game-action="menu" aria-label="스테이지 선택"><span aria-hidden="true">☰</span><small id="mapActionLabel">맵</small></button>
          <button class="utility-action utility-action--mute" type="button" data-game-action="mute" aria-label="사운드 켜기 또는 끄기" aria-keyshortcuts="M" aria-pressed="false"><span aria-hidden="true">♪</span><small id="muteActionLabel">소리</small></button>
        </nav>
      </section>

      <footer class="controls" aria-label="키보드 조작 안내">
        <span><kbd>←↑↓→</kbd> <i id="desktopMoveLabel">이동</i></span>
        <span><kbd>클릭</kbd> <i id="desktopClickLabel">이동</i></span>
        <span><kbd>Z</kbd> <i id="desktopNoiseLabel">소음</i></span>
        <span><kbd>X</kbd> <i id="desktopCloneLabel">복제</i></span>
      </footer>
    </main>

    <script type="module" src="./game.js?v=0.6.3"></script>
  </body>
</html>
