<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#72d9ff" />
    <meta name="description" content="8초 안에 열쇠를 찾아 잠긴 출구로 탈출하는 분신 협동 게임" />
    <title>8초 도둑단</title>
    <link rel="icon" href="./favicon.ico?v=0.13.0" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png?v=0.13.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16.png?v=0.13.0" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png?v=0.13.0" />
    <link rel="manifest" href="./site.webmanifest?v=0.13.0" />
    <link rel="stylesheet" href="./design-system.css?v=0.13.0" />
    <link rel="stylesheet" href="./styles.css?v=0.13.0" />
  </head>
  <body>
    <a class="skip-link" href="#game">게임 화면으로 바로가기</a>
    <main class="game-shell" id="mainContent">
      <section class="topbar ds-surface" aria-label="작전 상태">
        <div class="brand"><span class="brand-mark" aria-hidden="true">⏱</span> <span id="brandText">8초 도둑단</span></div>
        <div class="mission-copy">
          <span id="stageName">스테이지 1</span>
          <small id="objective">열쇠를 찾으면 출구가 열려요!</small>
        </div>
        <div class="hud-cluster" aria-label="현재 게임 정보">
          <div class="hud-stat"><span id="loopLabel">차례</span><strong id="loopCount">1</strong></div>
          <div class="hud-stat"><span id="echoLabel">분신</span><strong id="echoCount">0</strong></div>
          <div class="hud-stat timer-stat"><span id="timeLabel">남은 시간</span><strong id="timer">8.0</strong></div>
          <button class="game-menu-trigger" type="button" data-game-action="game-menu" aria-label="게임 메뉴" aria-controls="overlay" aria-expanded="false"><span aria-hidden="true">☰</span><small id="gameMenuActionLabel">메뉴</small></button>
        </div>
      </section>

      <section class="canvas-wrap">
        <canvas id="game" width="1200" height="700" tabindex="0" aria-label="8초 도둑단 장난감 도시 잠입 게임 화면" aria-describedby="gameHelp gameState">
          Canvas를 지원하는 최신 브라우저에서 플레이할 수 있습니다.
        </canvas>
        <p class="sr-only" id="gameHelp">8초 안에 열쇠를 찾고 출구로 가세요. Z로 경비원을 도발하면 현재 위치로 불러옵니다. X를 누르면 방금 움직임을 따라 하는 분신이 생깁니다.</p>
        <p class="sr-only" id="gameState">작전 메뉴가 열렸습니다.</p>

        <div class="alert-meter" id="alertMeter" role="meter" aria-label="발각 위험도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="안전">
          <span id="alertLabel">발각</span>
          <div class="alert-track"><i id="alertFill"></i></div>
        </div>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="sound-caption" id="soundCaption" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="overlay visible" id="overlay" role="dialog" aria-modal="true" aria-hidden="false" aria-labelledby="overlayTitle"></div>
      </section>

      <section class="mobile-gamepad ds-surface" aria-label="모바일 게임 조작">
        <div class="virtual-stick" id="virtualStick" role="application" tabindex="0" aria-label="이동 조이스틱. 손가락으로 끌어 이동합니다." aria-valuetext="가운데에 있어 정지됨">
          <span class="virtual-stick__tick virtual-stick__tick--up" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--right" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--down" aria-hidden="true"></span>
          <span class="virtual-stick__tick virtual-stick__tick--left" aria-hidden="true"></span>
          <span class="virtual-stick__knob" id="virtualStickKnob" aria-hidden="true"><i></i></span>
          <span class="virtual-stick__label" aria-hidden="true">이동</span>
        </div>

        <div class="mobile-primary-actions">
          <button class="mobile-action mobile-action--noise" type="button" data-game-action="noise" aria-keyshortcuts="Z"><strong>Z</strong><span id="noiseActionLabel">경비원 도발</span></button>
          <button class="mobile-action mobile-action--echo" type="button" data-game-action="save" aria-keyshortcuts="X"><strong>X</strong><span id="cloneActionLabel">분신 만들기</span></button>
        </div>

      </section>

      <footer class="controls" aria-label="키보드 조작 안내">
        <span><kbd>←↑↓→</kbd> <i id="desktopMoveLabel">이동</i></span>
        <span><kbd>클릭</kbd> <i id="desktopClickLabel">이동</i></span>
        <span><kbd>Z</kbd> <i id="desktopNoiseLabel">경비원 도발</i></span>
        <span><kbd>X</kbd> <i id="desktopCloneLabel">분신 만들기</i></span>
      </footer>
    </main>

    <script type="module" src="./game.js?v=0.13.0"></script>
  </body>
</html>
