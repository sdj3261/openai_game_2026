"$schema" = "./node_modules/wrangler/config-schema.json"
name = "gaia-2126-leaderboard"
main = "src/index.ts"
compatibility_date = "2026-08-08"

[vars]
SEASON_ID = "challenge-2026"
SCENARIO_ID = "earth-2026-standard"
ALLOWED_SEEDS = "0"
EXTRA_ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "gaia-leaderboard"
# Replace after: npx wrangler d1 create gaia-leaderboard
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[ratelimits]]
name = "RATE_LIMITER"
# Replace with a positive integer namespace unique within your account.
namespace_id = "2126"

[ratelimits.simple]
limit = 20
period = 60
